name: Build 8188eu driver only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-aarch64-linux-gnu bc flex bison \
            libssl-dev libelf-dev python3 python3-pip cpio rsync kmod

      - name: Clone ACK kernel source (android12-5.10-lts)
        run: |
          set -eux
          git clone --depth 1 \
            -b android12-5.10-lts \
            https://android.googlesource.com/kernel/common \
            kernel_common
          cd kernel_common
          echo "=== HEAD commit ==="
          git log --oneline -1
          head -5 Makefile

      - name: Prepare kernel headers + Module.symvers
        run: |
          set -eux
          cd kernel_common
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          echo "=== building vmlinux for Module.symvers ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux
          ls -la Module.symvers
          wc -l Module.symvers
          cat include/config/kernel.release

      - name: Clone rtl8188eus driver
        run: |
          set -eux
          git clone --depth 1 https://github.com/d3vilh/rtl8188eus driver
          cd driver
          git log --oneline -1

      - name: Build 8188eu.ko
        run: |
          set -eux
          cd driver
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -C $GITHUB_WORKSPACE/kernel_common \
            M=$PWD \
            KBUILD_EXTRA_SYMBOLS=$GITHUB_WORKSPACE/kernel_common/Module.symvers \
            KCFLAGS="-Wno-error=misleading-indentation -Wno-error -DCONFIG_LITTLE_ENDIAN -DCONFIG_ARM64" \
            CONFIG_RTL8188EU=m \
            modules 2>&1 | tee build.log || true
          echo "=== find .ko ==="
          find . -name "*.ko" -type f

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p out out/meta
          find driver -name "*.ko" -exec cp {} out/ \;
          cp kernel_common/Module.symvers out/meta/ 2>/dev/null || true
          cp kernel_common/include/config/kernel.release out/meta/ 2>/dev/null || true
          cd kernel_common && git log --oneline -1 > ../out/meta/kernel-commit.txt
          echo "=== out ==="
          ls -la out/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-ko
          path: |
            out/**/*
            driver/build.log
          if-no-files-found: warn
