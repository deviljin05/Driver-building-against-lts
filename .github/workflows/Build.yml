name: Build 8188eu driver only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-aarch64-linux-gnu bc flex bison \
            libssl-dev libelf-dev python3 python3-pip cpio rsync kmod

      - name: Clone ACK kernel source (android12-5.10-lts)
        run: |
          set -eux
          git clone --depth 1 \
            -b android12-5.10-lts \
            https://android.googlesource.com/kernel/common \
            kernel_common
          cd kernel_common
          echo "=== HEAD commit ==="
          git log --oneline -1
          head -5 Makefile

      - name: Configure kernel (gki_defconfig)
        run: |
          set -eux
          cd kernel_common
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_RTL8188EU=m
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_MAC80211_LEDS=y
          CONFIG_CRYPTO_ARC4=m
          CONFIG_CRYPTO_MICHAEL_MIC=m
          CONFIG_CRC_CCITT=m
          CONFIG_CRC_ITU_T=m
          EOF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel (vmlinux + modules → Module.symvers)
        run: |
          set -eux
          cd kernel_common
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          echo "=== building vmlinux ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux
          echo "=== vmlinux done ==="
          ls -la vmlinux 2>/dev/null || echo "vmlinux not in root"
          find . -maxdepth 3 -name "vmlinux" -type f 2>/dev/null | head
          echo "=== building modules (generates Module.symvers) ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules
          echo "=== Module.symvers check ==="
          ls -la Module.symvers
          wc -l Module.symvers
          echo "=== kernel.release ==="
          cat include/config/kernel.release

      - name: Clone rtl8188eus driver
        run: |
          set -eux
          git clone --depth 1 https://github.com/d3vilh/rtl8188eus driver
          cd driver
          echo "=== driver HEAD ==="
          git log --oneline -1

      - name: Build 8188eu.ko against kernel Module.symvers
        if: always()
        run: |
          set -eux
          cd driver
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -C $GITHUB_WORKSPACE/kernel_common \
            M=$PWD \
            KBUILD_EXTRA_SYMBOLS=$GITHUB_WORKSPACE/kernel_common/Module.symvers \
            KCFLAGS="-Wno-error=misleading-indentation -Wno-error -DCONFIG_LITTLE_ENDIAN -DCONFIG_ARM64" \
            CONFIG_RTL8188EU=m \
            modules 2>&1 | tee build.log || true
          echo "=== find .ko ==="
          find . -name "*.ko" -type f || true
          ls -la *.ko 2>/dev/null || echo "no .ko in root"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out out/meta
          if [ -d driver ]; then
            find driver -name "*.ko" -exec cp {} out/ \; || true
          fi
          if [ -f kernel_common/Module.symvers ]; then
            cp kernel_common/Module.symvers out/meta/ || true
          fi
          if [ -f kernel_common/include/config/kernel.release ]; then
            cp kernel_common/include/config/kernel.release out/meta/ || true
          fi
          if [ -d kernel_common ]; then
            cd kernel_common && git log --oneline -1 > ../out/meta/kernel-commit.txt || true
          fi
          echo "=== out tree ==="
          find out -type f || true
          ls -la out/ || true

      - name: Show modinfo
        if: always()
        run: |
          for f in out/*.ko; do
            echo "=== $f ==="
            modinfo "$f" || true
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-ko
          path: |
            out/**/*
            driver/build.log
          if-no-files-found: warn
